name: CinemaSeat CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Backend Typecheck & Lint
        run: |
          cd backend
          npm run lint

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Frontend Typecheck & Build
        run: |
          cd frontend
          npm run build

  concurrency-and-integration-tests:
    name: Concurrency & Reliability Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose Stack
        run: |
          docker compose up -d --build

      - name: Wait for Backend & Gateway Health
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:4000/health | grep -q "ok"; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting..."
            sleep 2
          done

      - name: Run 100-Request Concurrency Test (Zero Overselling)
        run: |
          npx tsx scripts/test_concurrency.ts

      - name: Run Payment Failure & Idempotency Test Matrix
        run: |
          npx tsx scripts/test_payment_matrix.ts

      - name: Run Abandoned Hold Expiration Test
        run: |
          npx tsx scripts/test_abandoned_hold.ts

      - name: Stop Docker Compose Stack
        if: always()
        run: |
          docker compose down -v
