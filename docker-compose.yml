version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cinemaseat
      POSTGRES_PASSWORD: cinemaseat
      POSTGRES_DB: cinemaseat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cinemaseat -d cinemaseat" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    image: asifmahmoud414/mock-gateway:latest
    environment:
      PORT: 9000
    ports:
      - "9000:9000"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:9000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      PUBLIC_BASE_URL: http://backend:4000
      DATABASE_URL: postgres://cinemaseat:cinemaseat@postgres:5432/cinemaseat
      REDIS_URL: redis://redis:6379
      GATEWAY_BASE_URL: http://gateway:9000
      GATEWAY_TIMEOUT_MS: 5000
      HOLD_TTL_SECONDS: 120
      HOLD_EXPIRY_SWEEP_INTERVAL_MS: 3000
      OTP_TTL_SECONDS: 180
      SEAT_MAP_CACHE_TTL_SECONDS: 2
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    # Run migrations + seed once, then start the server. Safe to re-run:
    # migrate.ts tracks applied files in schema_migrations, seed.ts clears
    # and reinserts its own rows.
    command: sh -c "node dist/db/migrate.js && node dist/db/seed.js && node dist/server.js"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
